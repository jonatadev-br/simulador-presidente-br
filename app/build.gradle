plugins { id 'com.android.application' }

android {
    namespace 'com.zyvo.presidentebr'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zyvo.presidentebr'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    signingConfigs {
        if (file('release.p12').exists()) {
            release {
                storeFile file('release.p12')
                storeType 'PKCS12'
                storePassword 'zyvoPresi2026'
                keyAlias 'zyvo'
                keyPassword 'zyvoPresi2026'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (file('release.p12').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    /* sem dependencias externas: Activity nativa + WebView */
}
