<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A1626">
<title>Simulador Presidente do Brasil</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"></div>

<script src="js/data-campaign.js"></script>
<script src="js/data-gov.js"></script>
<script src="js/engine.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  try {
    if (localStorage.getItem('spb_som') === '0') Snd.setEnabled(false);
  } catch (e) {}
  UI.start();
  document.addEventListener('touchstart', function once() {
    Snd.tap();
    document.removeEventListener('touchstart', once);
  }, { passive: true });
})();
</script>
</body>
</html>
