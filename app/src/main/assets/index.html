<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A1626">
<title>Simulador Presidente do Brasil</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"></div>

<script src="js/data-campaign.js"></script>
<script src="js/data-gov.js"></script>
<script src="js/engine.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  try {
    if (localStorage.getItem('spb_som') === '0') Snd.setEnabled(false);
  } catch (e) {}
  UI.start();
  document.addEventListener('touchstart', function once() {
    Snd.tap();
    document.removeEventListener('touchstart', once);
  }, { passive: true });
})();

/* Rede de seguranca: se o WebView antigo ignorar o gesto de rolagem nativo,
   este arrasto manual garante que a tela deslize mesmo assim. */
(function () {
  var y0 = null, sy0 = 0;
  document.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { y0 = null; return; }
    y0 = e.touches[0].clientY; sy0 = window.pageYOffset;
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (y0 === null || e.touches.length !== 1) return;
    var dy = y0 - e.touches[0].clientY;
    if (Math.abs(dy) < 6) return;
    if (Math.abs(window.pageYOffset - sy0) > 4) { y0 = null; return; } // nativo funcionou
    window.scrollBy(0, dy);
    y0 = e.touches[0].clientY; sy0 = window.pageYOffset;
  }, { passive: true });
  document.addEventListener('touchend', function () { y0 = null; }, { passive: true });
  document.addEventListener('touchcancel', function () { y0 = null; }, { passive: true });
})();
</script>
</body>
</html>
