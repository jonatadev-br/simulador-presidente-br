name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restaurar keystore de release
        run: echo "$KEYSTORE_B64" | base64 -d > app/release.p12
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: Build APK assinado
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: Simulador Presidente do Brasil v1.1
          body: "APK assinado (instala por cima das versoes anteriores). Baixe o arquivo abaixo e instale no celular."
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
