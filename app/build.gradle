plugins { id 'com.android.application' }

android {
    namespace 'com.zyvo.presidentebr'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zyvo.presidentebr'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    /* sem dependencias externas: Activity nativa + WebView */
}
